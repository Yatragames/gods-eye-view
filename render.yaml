services:
  - type: web
    name: gods-eye-view
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-hosted.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: '1'
